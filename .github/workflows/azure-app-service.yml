name: Deploy Unicom TIC to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build public bundle
        run: npm run build

      - name: Validate public bundle
        run: npm run check

      - name: Prepare App Service package
        run: |
          rm -rf app-package
          mkdir -p app-package/scripts
          cp -R dist/. app-package/
          cp scripts/server.mjs app-package/scripts/server.mjs
          cp package.json app-package/package.json

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app-package
